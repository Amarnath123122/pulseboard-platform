# Pulseboard API gateway (local / Docker). One origin for the browser; routes by path to each service.
#   /api/v1/auth/*, /api/v1/users*, /.well-known/*  -> identity
#   /api/*  (REST + SSE), /ws/* (WebSocket)          -> api
#   /internal/*, /docs, /openapi.json                 -> blocked (service-to-service / dev only)
#   everything else                                   -> web (Angular SPA)
# Azure uses API Management with the same routes (see infra/main.bicep).

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

upstream identity { server identity:8000; keepalive 16; }
upstream api      { server api:8000;      keepalive 32; }
upstream web      { server web:8080;      keepalive 8; }

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location ~ ^/(internal|docs|redoc|openapi\.json) { return 404; }

  location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://identity; }
  location /api/v1/users { limit_req zone=api burst=50 nodelay; proxy_pass http://identity; }
  location /.well-known/ { proxy_pass http://identity; }

  location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://api;
    proxy_buffering off;          # SSE: stream assistant replies as they are produced
    proxy_read_timeout 300s;
  }

  location /ws/ {
    proxy_pass http://api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location = /gateway/health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

  location / { proxy_pass http://web; }
}
